<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Карусель</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <audio src="EllektraJazz - Nocturne in Blue.mp3" preload="auto"></audio>

    <header></header>

    <main class="main_cantain">

        <!-- ===== Карточка 1: кошка ===== -->
        <div class="carousel carousel_1">
            <div class="slide">
                <img src="cat.png" class="active" alt="1">
                <img src="Cat icom.png" alt="2">
            </div>
            <div class="info">
                <h1>My first pet</h1>
                <p>Tyt kakoyto tekst</p>
            </div>
            <div class="buttons">
                <button class="prev">Назад</button>
                <button class="next">Вперёд</button>
            </div>
        </div>

        <!-- ===== Карточка 2: игра ===== -->
        <div class="carousel carousel_2">
            <div class="slide">
                <img src="Minecraft.png" class="active" alt="1">
                <img src="minecraft-icon.png" alt="2">
            </div>
            <div class="info">
                <h1>My first game</h1>
                <p>tyt kakoyto tekst</p>
            </div>
            <div class="buttons">
                <button class="prev">Назад</button>
                <button class="next">Вперёд</button>
            </div>
        </div>

        <!-- ===== Карточка 3: школа ===== -->
        <div class="carousel carousel_3">
            <div class="slide">
                <img src="school.png" class="active" alt="1">
                <img src="School icon.png" alt="2">
            </div>
            <div class="info">
                <h1>My favorite school</h1>
                <p>tyt kakoyto tekst</p>
            </div>
            <div class="buttons">
                <button class="prev">Назад</button>
                <button class="next">Вперёд</button>
            </div>
        </div>

    </main>

    <footer></footer>
</body>
</html>
